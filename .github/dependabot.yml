version: 2

updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - pub
    groups:
      pub-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
    labels:
      - dependencies
      - gradle
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The Android toolchain moves with Flutter upgrades (specification 3.1).
      - dependency-name: com.android.*
        update-types: [version-update:semver-major]
      - dependency-name: org.jetbrains.kotlin*
        update-types: [version-update:semver-major]
      - dependency-name: dev.flutter.*
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    target-branch: site
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - npm
