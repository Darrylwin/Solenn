name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Releases must never overlap, and a running one must never be cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A token other than GITHUB_TOKEN is required so that the release PR
      # triggers the CI workflow.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-android:
    name: Build Android release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Holds the signing secrets and requires a manual approval.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      REQUIRE_RELEASE_SIGNING: "true"
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Write the signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode > android/solenn-release.jks
          printf 'storeFile=solenn-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${STORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}" > android/key.properties

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${VERSION}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Build the app bundle
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${VERSION}" --build-number="${GITHUB_RUN_NUMBER}"

      - name: Verify the release manifest
        run: dart run tool/check_release_manifest.dart

      - name: Check the size budget
        run: dart run tool/check_apk_size.dart build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Stage the artifacts
        run: |
          mkdir dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
              "dist/solenn-${VERSION}-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab \
            "dist/solenn-${VERSION}-android.aab"
          (cd build/symbols && zip -qr "../../dist/solenn-${VERSION}-symbols.zip" .)
          (cd dist && sha256sum solenn-* > SHA256SUMS)

      # Artifact attestations need a public repository (or GitHub Enterprise).
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*

      - name: Attach the artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber

      - name: Remove the signing material
        if: always()
        run: rm -f android/key.properties android/solenn-release.jks

  verify-ios:
    name: Verify iOS build
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      # No signing identity exists (constraint C8): this proves the release
      # compiles, it does not produce an installable IPA.
      - name: Build without code signing
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${VERSION}" --build-number="${GITHUB_RUN_NUMBER}"
