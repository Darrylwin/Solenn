name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      # A token other than GITHUB_TOKEN is required so that release PRs
      # trigger the CI workflows.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Protected environment: requires manual approval and holds the signing secrets.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      BUILD_NUMBER: ${{ github.run_number }}
      # 25 MiB budget for the arm64 release APK.
      APK_SIZE_BUDGET_BYTES: 26214400
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/setup-flutter

      - name: Write signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret ${name} in the 'release' environment."
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/solenn-release.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          {
            printf 'storePassword=%s\n' "${ANDROID_KEYSTORE_PASSWORD}"
            printf 'keyPassword=%s\n' "${ANDROID_KEY_PASSWORD}"
            printf 'keyAlias=%s\n' "${ANDROID_KEY_ALIAS}"
            printf 'storeFile=%s\n' "${keystore}"
          } > android/key.properties

      - name: Build split-per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${TAG#v}" --build-number="${BUILD_NUMBER}"

      - name: Check release manifest
        run: dart run tool/check_release_manifest.dart

      - name: Check size budget
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          size="$(stat -c %s "${apk}")"
          echo "arm64 APK: ${size} bytes (budget ${APK_SIZE_BUDGET_BYTES})"
          if [ "${size}" -gt "${APK_SIZE_BUDGET_BYTES}" ]; then
            echo "::error::arm64 APK exceeds the size budget."
            exit 1
          fi

      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --build-name="${TAG#v}" --build-number="${BUILD_NUMBER}"

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir dist
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi="${apk##*/app-}"
            abi="${abi%-release.apk}"
            cp "${apk}" "dist/solenn-${version}-android-${abi}.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/solenn-${version}-android.aab"
          (cd build/symbols && zip -qr "../../dist/solenn-${version}-symbols.zip" .)
          (cd dist && sha256sum solenn-* > SHA256SUMS)
          ls -l dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.apk
            dist/*.aab
            dist/*.zip

      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" dist/* --clobber

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "${RUNNER_TEMP}/solenn-release.jks"
