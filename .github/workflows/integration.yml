name: Integration

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'integration_test/**'
      - 'assets/**'
      - 'android/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      found: ${{ steps.scan.outputs.found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scan
        run: |
          if compgen -G "integration_test/*_test.dart" > /dev/null; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No integration tests yet (integration_test/*_test.dart)."
          fi

  android:
    name: Android emulator (API 34)
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/setup-flutter
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          script: bash -o pipefail -c 'flutter test integration_test 2>&1 | tee integration-android.log || { adb exec-out screencap -p > failure-android.png; exit 1; }'
      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-android
          path: |
            integration-android.log
            failure-android.png
          if-no-files-found: ignore

  ios:
    name: iOS simulator (iPhone 16, iOS 18.6)
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIMULATOR_NAME: iPhone 16
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Boot simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json \
            | jq -r --arg rt "${SIMULATOR_RUNTIME}" --arg name "${SIMULATOR_NAME}" \
              '.devices[$rt] // [] | map(select(.name == $name)) | .[0].udid // empty')"
          if [ -z "${udid}" ]; then
            echo "::error::Simulator '${SIMULATOR_NAME}' not found for runtime ${SIMULATOR_RUNTIME}."
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl bootstatus "${udid}" -b
          echo "SIMULATOR_UDID=${udid}" >> "${GITHUB_ENV}"
      - name: Run integration tests
        run: set -o pipefail; flutter test integration_test -d "${SIMULATOR_UDID}" 2>&1 | tee integration-ios.log
      - name: Capture screenshot
        if: failure()
        run: xcrun simctl io "${SIMULATOR_UDID}" screenshot failure-ios.png
      - name: Upload logs and screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-ios
          path: |
            integration-ios.log
            failure-ios.png
          if-no-files-found: ignore
