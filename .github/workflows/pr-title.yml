name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    name: PR Title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate the Conventional Commit title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          scopes: |
            calculator
            subscription
            account
            core
            design-system
            platform
            app
            l10n
            android
            ios
            deps
            release
            docs
            ci
            main
          requireScope: false
          subjectPattern: ^[a-z0-9].*[^.]$
          subjectPatternError: >-
            The subject must start in lower case and must not end with a period.
