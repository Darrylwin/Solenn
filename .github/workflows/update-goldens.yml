name: Update goldens

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch on which to regenerate the golden images (never main)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-goldens-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  update-goldens:
    name: Regenerate goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ inputs.branch }}
    steps:
      - name: Refuse main
        run: |
          if [ "${TARGET_BRANCH}" = "main" ] || [ "${TARGET_BRANCH}" = "refs/heads/main" ]; then
            echo "::error::Goldens are never regenerated on main. Use a feature branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          # Credentials are kept only so this job can push the updated images.
          # It runs on manual dispatch by a user with write access.
          persist-credentials: true
      - uses: ./.github/actions/setup-flutter
      - name: Regenerate golden images
        run: flutter test --tags golden --update-goldens
      - name: Commit updated images
        run: |
          set -euo pipefail
          if git status --porcelain -- test | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test
            git commit -m "test: update golden images"
            git push origin "HEAD:${TARGET_BRANCH}"
          else
            echo "Golden images are already up to date."
          fi
