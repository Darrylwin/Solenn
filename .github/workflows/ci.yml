name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ github.event_name != 'pull_request' || steps.filter.outputs.app == 'true' }}
      android: ${{ github.event_name != 'pull_request' || steps.filter.outputs.android == 'true' }}
      ios: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ios == 'true' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Filter paths
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - 'lib/**'
              - 'test/**'
              - 'integration_test/**'
              - 'assets/**'
              - 'tool/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.fvmrc'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            android:
              - 'android/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - '.fvmrc'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  quality:
    name: Static analysis
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Check generated localizations are up to date
        run: |
          flutter gen-l10n
          dart format lib/l10n
          if [[ -n "$(git status --porcelain -- lib/l10n)" ]]; then
            echo "::error::Generated localizations are stale. Run 'flutter gen-l10n' and commit the result."
            git status --short -- lib/l10n
            exit 1
          fi

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Run tests
        run: flutter test --coverage --reporter github

      - name: Enforce coverage thresholds
        run: dart run tool/check_coverage.dart

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  build-android:
    name: Build Android
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify the merged release manifest
        run: dart run tool/check_release_manifest.dart

  build-ios:
    name: Build iOS
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, quality, test, build-android, build-ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify job results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "${RESULTS}"
          if echo "${RESULTS}" | jq -e 'any(.[]; . == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::At least one required job failed or was cancelled."
            exit 1
          fi
