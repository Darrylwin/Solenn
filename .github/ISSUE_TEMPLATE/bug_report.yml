name: Bug report
description: Something does not work as specified.
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: version
    attributes:
      label: App version and build
      description: Shown in Account, for example 0.1.0 (42).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      description: Model, and navigation mode on Android (gesture or 3-button).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Optional. Drag files into this field.
